<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>$title$</title>
</head>
<body>
  <div class="cover">
    <img class="cover-mark" src="assets/logo.svg" alt="Logo do Astrofy">
    <div class="cover-title">
      <div class="cover-kicker">Astrofy</div>
      <h1>Guia do usuário</h1>
      <div class="cover-tagline">Do pedido da página à implementação validada</div>

    </div>
    <div class="cover-meta">
      <div>Edição v$version$</div>
      <div>Gerado em $date$</div>
      <div>Fonte editorial: docs/user/</div>
    </div>
  </div>
  $if(toc)$
  <nav id="TOC" role="doc-toc">$toc$</nav>
  $endif$
  <main>$body$</main>

</html>
