name: Validar Astrofy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framework:
    name: Node ${{ matrix.node }} em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.12.0', '24', '26']
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Instalar versões do lockfile
        run: npm ci
      - name: Compilar e testar contratos, processos e TUI
        run: npm run test:unit
      - name: Conferir distribuição npm
        run: npm pack --dry-run
      - name: Conferir o comando instalado globalmente
        run: |
          npm install --global .
          astrofy --help
          astrofy --version --json

  browser:
    name: Chromium e verificações de browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Restaurar Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências do Chromium
        run: npx playwright install-deps chromium
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Executar verificações reais no Chromium
        run: npm run test:browser

  compatibility:
    name: Fixtures Astro 5, 6 e 7
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/compatibility/astro5/package-lock.json
            fixtures/compatibility/astro6/package-lock.json
            fixtures/compatibility/astro7/package-lock.json
      - name: Instalar framework e fixtures
        run: |
          npm ci
          npm --prefix fixtures/compatibility/astro5 ci
          npm --prefix fixtures/compatibility/astro6 ci
          npm --prefix fixtures/compatibility/astro7 ci
      - name: Restaurar Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar dependências do Chromium
        run: npx playwright install-deps chromium
      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Preparar builds das fixtures
        run: |
          npm run build
          for version in astro5 astro6 astro7; do
            node dist/cli/index.js init --root "fixtures/compatibility/$version"
            mkdir -p "fixtures/compatibility/$version/.astrofy/design"
            cp fixtures/design-system.json "fixtures/compatibility/$version/.astrofy/design/design-system.json"
            node dist/cli/index.js tokens build --root "fixtures/compatibility/$version"
            npm --prefix "fixtures/compatibility/$version" run build
          done
      - name: Conferir builds e procedimentos das skills
        run: |
          npm run test:compatibility
          npm run test:project-fixtures
          npm run test:skill-procedures
          npm run test:skill-domains

  documentation:
    name: Manual, ebook e pacote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar verificadores do ebook
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils poppler-utils unzip
      - name: Instalar dependências
        run: npm ci
      - name: Conferir documentação, ebook e release
        run: |
          npm run skills:matrix:check
          npm run docs:verify
          npm run ebook:verify
          npm run release:check
      - name: Conferir pacote instalado
        run: |
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          version="$(node -p "require('./package.json').version")"
          npm run package:verify -- "artifacts/promovaweb-astrofy-${version}.tgz"
